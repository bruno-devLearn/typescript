<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/style.css" />
        <title>Library</title>
    </head>
    <body>
        <main class="container">
            <h1>Biblioteca</h1>

            <form
                id="book-form"
                class="book-form"
                autocomplete="off"
                aria-label="Adicionar livro"
            >
                <div class="field">
                    <label for="titulo">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Digite o título"
                        required
                    />
                </div>

                <div class="field">
                    <label for="autor">Autor</label>
                    <input
                        type="text"
                        id="autor"
                        name="autor"
                        placeholder="Nome do autor"
                        required
                    />
                </div>

                <div class="field">
                    <label for="paginas">Páginas</label>
                    <input
                        type="number"
                        id="paginas"
                        name="paginas"
                        placeholder="Número de páginas"
                        min="1"
                        required
                    />
                </div>

                <fieldset class="field status" aria-label="Status de leitura">
                    <legend>Status</legend>
                    <label class="radio">
                        <input
                            type="radio"
                            name="status"
                            id="lido"
                            value="lido"
                        />
                        Lido
                    </label>
                    <label class="radio">
                        <input
                            type="radio"
                            name="status"
                            id="nao-lido"
                            value="nao lido"
                            checked
                        />
                        Não lido
                    </label>
                </fieldset>

                <div class="actions">
                    <button type="submit" class="btn primary">Adicionar</button>
                    <button type="reset" class="btn">Limpar</button>
                </div>
            </form>

            <section id="book-list" class="book-list" aria-live="polite">
                <!-- Lista de livros será renderizada aqui -->
            </section>
        </main>

        <script type="module" src="src/ts/DOM.ts"></script>
    </body>
</html>
